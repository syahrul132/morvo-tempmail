<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin — ADZ TempMail</title><link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"></head>
<body>
<nav class="nav"><div class="container nav-inner"><a class="brand" href="/"><span class="logo">A</span><span>Admin ADZ TempMail</span></a><div class="nav-links"><a href="/">Website</a></div><button class="btn small danger" onclick="logout()">Logout</button></div></nav>
<main class="container admin-page">
  <section id="loginPanel" class="auth-card"><h1>Login Admin</h1><p class="muted">Default: admin / admin123. Ganti password setelah deploy.</p><label class="field"><span>Username</span><input id="loginUser" value="admin"></label><label class="field"><span>Password</span><input id="loginPass" type="password" value="admin123"></label><button class="btn primary full" onclick="login()">Login</button></section>
  <section id="adminPanel" class="hide"><div class="admin-grid">
    <div class="panel"><h2>Setting Website</h2><label class="field"><span>Nama website</span><input id="siteName"></label><label class="field"><span>Hero title</span><input id="heroTitle"></label><label class="field"><span>Hero subtitle</span><textarea id="heroSubtitle"></textarea></label><label class="field"><span>Free hours</span><input id="freeHours" type="number"></label><label class="field"><span>Harga unlimited</span><input id="unlimitedPrice" type="number"></label><label class="check"><input id="allowSending" type="checkbox"> Izinkan kirim email</label><label class="field"><span>SMTP mode</span><select id="smtpMode"><option value="demo">Demo record only</option><option value="queued">Queued for SMTP worker</option></select></label><button class="btn primary" onclick="saveSettings()">Simpan setting</button></div>
    <div class="panel"><h2>Tambah / Update Ads</h2><input id="adId" type="hidden"><label class="field"><span>Slot</span><select id="adSlot"><option value="header">header</option><option value="sidebar">sidebar</option><option value="pricing">pricing</option></select></label><label class="field"><span>Judul</span><input id="adTitle"></label><label class="field"><span>Body</span><textarea id="adBody"></textarea></label><label class="field"><span>URL</span><input id="adUrl" placeholder="https://..."></label><label class="field"><span>Image URL optional</span><input id="adImageUrl"></label><label class="check"><input id="adActive" type="checkbox" checked> Aktif</label><div class="actions-row"><button class="btn green" onclick="saveAd()">Simpan ads</button><button class="btn" onclick="resetAdForm()">Reset</button></div></div>
    <div class="panel wide"><h2>Daftar Ads</h2><div id="adsList" class="mail-list"></div></div>
    <div class="panel wide"><h2>Mailbox & Statistik</h2><div id="stats" class="stats compact"></div><div id="mailboxes" class="mail-list"></div></div>
    <div class="panel wide"><h2>Ganti Admin</h2><label class="field"><span>Username baru</span><input id="newUsername" placeholder="admin"></label><label class="field"><span>Password baru</span><input id="newPassword" type="password" placeholder="minimal kuatkan sendiri"></label><button class="btn orange" onclick="changePassword()">Update admin</button></div>
  </div></section>
</main><div id="toast" class="toast"></div><script src="/admin.js"></script>
</body></html>
