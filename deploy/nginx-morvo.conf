# /etc/nginx/sites-available/morvo-tempmail
# Symlink to: /etc/nginx/sites-enabled/morvo-tempmail
#
# Prerequisites:
#   - apt install nginx certbot python3-certbot-nginx
#   - DNS A record: morvo.me -> YOUR_SERVER_IP
#   - DNS A record: www.morvo.me -> YOUR_SERVER_IP
#   - DNS MX record: adzstore.my.id -> mail.adzstore.my.id
#   - DNS A record: mail.adzstore.my.id -> YOUR_SERVER_IP

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name morvo.me www.morvo.me;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name morvo.me www.morvo.me;

    ssl_certificate /etc/letsencrypt/live/morvo.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/morvo.me/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 10m;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }
}
